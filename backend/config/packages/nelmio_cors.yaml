nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # X-Device-Id identifica o aparelho enquanto não há login.
        allow_headers: ['Content-Type', 'Authorization', 'X-Device-Id']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
