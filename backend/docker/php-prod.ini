; A imagem oficial não aplica php.ini-production sozinha; estes são os ajustes
; que a API precisa em produção.
expose_php = Off
memory_limit = 256M

; PESCA_MAX_PHOTO_BYTES aceita até 8 MB. O caminho normal de upload é PUT com
; bytes crus (que não passa por post_max_size), mas a API também aceita POST
; multipart — e aí estes dois limites é que valem.
upload_max_filesize = 8M
post_max_size = 12M

; O código não muda enquanto o container vive, então não há por que revalidar
; timestamp a cada require. Um deploy novo sobe um container novo.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
