# Só existe um site neste container, então não há VirtualHost: a configuração
# vale globalmente e a porta fica por conta do ports.conf que o entrypoint gera.
DocumentRoot /var/www/app/public

<Directory /var/www/app/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # O projeto não usa symfony/apache-pack (não há .htaccess): tudo que não for
    # arquivo real no disco cai no front controller, preservando a query string.
    FallbackResource /index.php
</Directory>

# var/ guarda cache, log e — sem volume — as fotos. Nada disso é servido pelo
# Apache; as fotos saem por um controller, que checa o dono antes de responder.
<Directory /var/www/app/var>
    Require all denied
</Directory>

# Logs no stdout/stderr do container, que é onde o Railway lê.
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

ServerTokens Prod
ServerSignature Off
